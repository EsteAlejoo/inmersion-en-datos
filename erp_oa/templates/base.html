<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ERP Ordenes Aplicacion{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 14px; color: #222; background: #f5f5f5; }

    nav { background: #2d6a4f; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    nav .logo { font-weight: bold; font-size: 16px; }
    nav a { color: white; text-decoration: none; font-size: 14px; }
    nav a:hover { text-decoration: underline; }

    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #2d6a4f; color: white; padding: 8px 10px; text-align: left; }
    td { padding: 7px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    tr:hover td { background: #f0fff4; }

    .btn { display: inline-block; padding: 7px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 13px; text-decoration: none; line-height: 1.4; }
    .btn-verde  { background: #2d6a4f; color: white; }
    .btn-verde:hover { background: #1b4332; }
    .btn-gris   { background: #6c757d; color: white; }
    .btn-gris:hover { background: #5a6268; }
    .btn-rojo   { background: #dc3545; color: white; }
    .btn-rojo:hover { background: #c82333; }
    .btn-amarillo { background: #ffc107; color: #222; }
    .btn-azul   { background: #0d6efd; color: white; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #2d6a4f; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    .alerta-rojo    { background: #f8d7da; border-left: 4px solid #dc3545; padding: 10px 14px; margin-bottom: 12px; border-radius: 4px; }
    .alerta-amarillo{ background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px 14px; margin-bottom: 12px; border-radius: 4px; }
    .alerta-verde   { background: #d1e7dd; border-left: 4px solid #2d6a4f; padding: 10px 14px; margin-bottom: 12px; border-radius: 4px; }
    .alerta-info    { background: #cff4fc; border-left: 4px solid #0dcaf0; padding: 10px 14px; margin-bottom: 12px; border-radius: 4px; }

    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .badge-borrador  { background: #e9ecef; color: #495057; }
    .badge-confirmada{ background: #d1e7dd; color: #0f5132; }
    .badge-anulada   { background: #f8d7da; color: #842029; }

    .flash-success { background: #d1e7dd; color: #0f5132; padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; }
    .flash-error   { background: #f8d7da; color: #842029; padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; }

    h1 { font-size: 20px; margin-bottom: 16px; }
    h2 { font-size: 17px; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-bottom: 10px; color: #2d6a4f; }

    .text-muted { color: #6c757d; }
    .text-verde { color: #2d6a4f; font-weight: bold; }
    .mt-1 { margin-top: 8px; }
    .mt-2 { margin-top: 16px; }
    .gap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      nav { gap: 12px; }
      table { font-size: 12px; }
    }
  </style>
</head>
<body>
<nav>
  <span class="logo">ERP Ordenes Aplicacion</span>
  <a href="{{ url_for('oas.lista') }}">Ordenes</a>
  <a href="{{ url_for('maestros.cuarteles') }}">Cuarteles</a>
  <a href="{{ url_for('maestros.productos') }}">Productos</a>
  <a href="{{ url_for('importacion.index') }}">Importar</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
